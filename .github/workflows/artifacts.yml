name: Qualified native and installed artifacts

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - src/codex_session_gc/compatibility/support.json
  workflow_dispatch:
    inputs:
      mode:
        description: Attest the exact source support record
        required: true
        type: choice
        options: [support]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: '0.12.8'
  UV_ARCHIVE_SHA256: 2e2b37e9811e17675a9e70bed5e1a58fc8c0388be63d751d72cc735188c149ff
  PYTHON_VERSION: '3.14.7'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  acquire-native:
    name: Acquire the declared native component
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'YuriyKrasilnikov/codex-session-gc'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps: &native_acquisition_steps
      - name: Allocate isolated acquisition storage
        run: |
          set -eu
          gc_acquire_root="$(mktemp -d "$RUNNER_TEMP/codex-session-gc-native.XXXXXX")"
          echo "GC_ACQUIRE_ROOT=$gc_acquire_root" >> "$GITHUB_ENV"
      - name: Read and verify the declared native component
        env:
          GC_ACQUIRE_TOKEN: ${{ github.token }}
        run: |
          set -eu
          case "$GC_ACQUIRE_TOKEN" in ''|*$'\n'*|*$'\r'*) echo 'Invalid acquisition token' >&2; exit 1 ;; esac
          command -v curl
          command -v python3
          gc_acquire_curl="$(curl --version | head -1 | cut -d' ' -f2)"
          python3 -c 'import sys; v=tuple(int(x) for x in sys.argv[1].split(".")[:3]); assert v >= (8, 4, 0)' "$gc_acquire_curl"
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'Authorization: Bearer %s\n' "$GC_ACQUIRE_TOKEN" | curl --header @- --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 5 --max-time 60 --max-filesize 1048576 --header 'Accept: application/vnd.github.raw+json' --output "$GC_ACQUIRE_ROOT/provenance.json" -- "https://api.github.com/repos/YuriyKrasilnikov/codex-session-gc/contents/native/build-inputs/provenance.json?ref=$GITHUB_SHA"
          python3 - "$GC_ACQUIRE_ROOT/provenance.json" > "$GC_ACQUIRE_ROOT/locator.txt" <<'PY'
          import json, re, sys

          def unique(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError('duplicate key')
                  result[key] = value
              return result

          with open(sys.argv[1], 'rb') as source:
              raw = source.read(1048577)
          if not 0 < len(raw) <= 1048576:
              raise ValueError('invalid provenance size')
          value = json.loads(raw, object_pairs_hook=unique)
          locator = value['build_qualification']['native_candidate']['transport']
          if not isinstance(locator, dict) or set(locator) != {'asset_id', 'sha256', 'bytes'}:
              raise ValueError('invalid native locator')
          asset, digest, size = locator['asset_id'], locator['sha256'], locator['bytes']
          if type(asset) is not int or asset <= 0 or type(size) is not int or size <= 0:
              raise ValueError('unbound or invalid native locator')
          if not isinstance(digest, str) or re.fullmatch(r'[0-9a-f]{64}', digest) is None:
              raise ValueError('invalid native digest')
          print(asset, size, digest)
          PY
          read -r gc_asset gc_bytes gc_sha < "$GC_ACQUIRE_ROOT/locator.txt"
          printf 'Authorization: Bearer %s\n' "$GC_ACQUIRE_TOKEN" | curl --header @- --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-redirs 5 --max-time 180 --max-filesize "$gc_bytes" --header 'Accept: application/octet-stream' --output "$GC_ACQUIRE_ROOT/native-component.tar.gz" -- "https://api.github.com/repos/YuriyKrasilnikov/codex-session-gc/releases/assets/$gc_asset"
          test -f "$GC_ACQUIRE_ROOT/native-component.tar.gz" && test ! -L "$GC_ACQUIRE_ROOT/native-component.tar.gz"
          test "$(wc -c < "$GC_ACQUIRE_ROOT/native-component.tar.gz")" -eq "$gc_bytes"
          test "$(sha256sum "$GC_ACQUIRE_ROOT/native-component.tar.gz" | cut -d' ' -f1)" = "$gc_sha"
      - name: Transfer the verified component within this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GC_ACQUIRE_ROOT }}/native-component.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Remove acquisition storage
        if: always()
        run: |
          set -eu
          if [ -n "${GC_ACQUIRE_ROOT:-}" ]; then
            case "$GC_ACQUIRE_ROOT" in
              "$RUNNER_TEMP"/codex-session-gc-native.*) rm -rf -- "$GC_ACQUIRE_ROOT" ;;
              *) echo 'Unexpected acquisition path' >&2; exit 1 ;;
            esac
          fi

  acquire-native-readonly:
    name: Acquire the declared public native component
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps: *native_acquisition_steps

  matched-artifacts:
    name: Qualified native and installed artifacts
    needs: [acquire-native, acquire-native-readonly]
    if: ${{ always() && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Require qualified native acquisition
        if: >-
          (github.event_name == 'push' && needs.acquire-native.result != 'success') ||
          (github.event_name == 'pull_request' && needs.acquire-native-readonly.result != 'success')
        run: |
          echo 'Qualified native material is unavailable for this event or acquisition failed.' >&2
          exit 1
      - name: Require the selected hosted runner and acquisition tools
        run: |
          set -eu
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 26.04
          command -v git
          command -v curl
          command -v node
          command -v python3
          git --version
          curl --version
          gc_ci_curl="$(curl --version | head -1 | cut -d' ' -f2)"
          python3 -c 'import sys; v=tuple(int(x) for x in sys.argv[1].split(".")[:3]); assert v >= (8, 4, 0)' "$gc_ci_curl"
          uname -a
      - name: Allocate isolated job resources
        run: |
          set -eu
          gc_ci_root="$(mktemp -d "$RUNNER_TEMP/codex-session-gc-artifacts.XXXXXX")"
          mkdir "$gc_ci_root/tmp" "$gc_ci_root/release"
          {
            echo "GC_CI_ROOT=$gc_ci_root"
            echo "TMPDIR=$gc_ci_root/tmp"
            echo "UV_CACHE_DIR=$gc_ci_root/cache"
            echo "UV_PYTHON_INSTALL_DIR=$gc_ci_root/python"
            echo "UV_PROJECT_ENVIRONMENT=$gc_ci_root/venv"
            echo "PYTHONPATH=$GITHUB_WORKSPACE/src"
          } >> "$GITHUB_ENV"
          test "$(uname -m)" = x86_64
          ldd --version | head -1
          df -h "$gc_ci_root"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ env.UV_ARCHIVE_SHA256 }}
          enable-cache: false
          cache-local-path: ${{ env.UV_CACHE_DIR }}
      - name: Prepare pinned Python and locked tools
        run: |
          set -eu
          uv python install --no-config "$PYTHON_VERSION"
          gc_ci_python="$(uv python find --no-config "$PYTHON_VERSION")"
          echo "GC_CI_PYTHON=$gc_ci_python" >> "$GITHUB_ENV"
          uv sync --locked --no-config --group build --no-install-project --no-build --no-python-downloads --python "$gc_ci_python"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -c 'import platform; assert platform.machine() == "x86_64"; assert platform.libc_ver() == ("glibc", "2.43"); assert platform.python_version() == "3.14.7"'
      - name: Record actual runtime and source identities
        run: |
          set -eu
          export GC_CI_SOURCE_COMMIT="$(git rev-parse HEAD)"
          export GC_CI_UV_ACTUAL="$(uv --version)"
          export GC_CI_IMAGE_OS="$ImageOS"
          export GC_CI_IMAGE_VERSION="$ImageVersion"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_runtime > "$GC_CI_ROOT/runtime.json"
          cat "$GC_CI_ROOT/runtime.json"
      - name: Retrieve the same-run native component
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-component-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GC_CI_ROOT }}/native-incoming
      - name: Verify native inputs and select the qualified helper
        run: |
          set -eu
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_native > "$GC_CI_ROOT/native-source.json"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_native --describe > "$GC_CI_ROOT/anchors.json"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_native --component "$GC_CI_ROOT/native-incoming/native-component.tar.gz" --helper "$GC_CI_ROOT/helper" > "$GC_CI_ROOT/native-reuse.json"
      - name: Evaluate the required real native interface cases
        env:
          GC_MCP_NATIVE_HELPER: ${{ env.GC_CI_ROOT }}/helper
        run: |
          set -eu
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_pytest tests/test_mcp_native.py tests/test_mcp_disconnect.py tests/test_mixed_native.py --basetemp "$GC_CI_ROOT/native-tests" -o "cache_dir=$GC_CI_ROOT/native-cache" --junitxml "$GC_CI_ROOT/native.xml"
      - name: Build real source distribution, wheel and matched bundle
        run: |
          set -eu
          gc_ci_version="$("$UV_PROJECT_ENVIRONMENT/bin/python" -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "GC_CI_VERSION=$gc_ci_version" >> "$GITHUB_ENV"
          uv build --sdist --no-config --no-python-downloads --no-build-isolation --python "$UV_PROJECT_ENVIRONMENT/bin/python" --out-dir "$GC_CI_ROOT/release"
          uv build --wheel "$GC_CI_ROOT/release/codex_session_gc-$gc_ci_version.tar.gz" --no-config --no-python-downloads --no-build-isolation --python "$UV_PROJECT_ENVIRONMENT/bin/python" --out-dir "$GC_CI_ROOT/release"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.build_release --wheel "$GC_CI_ROOT/release/codex_session_gc-$gc_ci_version-py3-none-any.whl" --helper "$GC_CI_ROOT/helper" --output "$GC_CI_ROOT/release/codex-session-gc-$gc_ci_version-linux-x86_64"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_release --sdist "$GC_CI_ROOT/release/codex_session_gc-$gc_ci_version.tar.gz" --wheel "$GC_CI_ROOT/release/codex_session_gc-$gc_ci_version-py3-none-any.whl" --bundle "$GC_CI_ROOT/release/codex-session-gc-$gc_ci_version-linux-x86_64" --helper "$GC_CI_ROOT/helper" > "$GC_CI_ROOT/structure.json"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.build_installer --output "$GC_CI_ROOT/release/codex-session-gc-installer-$gc_ci_version.pyz"
          "$GC_CI_PYTHON" -I "$GC_CI_ROOT/release/codex-session-gc-installer-$gc_ci_version.pyz" --help > "$GC_CI_ROOT/installer-help.txt"
      - name: Install the actual bundle outside the checkout
        run: |
          set -eu
          uv venv --no-project --no-python-downloads --python "$GC_CI_PYTHON" "$GC_CI_ROOT/installed-venv"
          uv export --locked --no-config --no-python-downloads --only-group test --no-emit-project --format requirements-txt > "$GC_CI_ROOT/test-requirements.txt"
          cd "$GC_CI_ROOT/release/codex-session-gc-$GC_CI_VERSION-linux-x86_64"
          uv pip install --python "$GC_CI_ROOT/installed-venv/bin/python" --require-hashes --only-binary :all: -r install-requirements.txt
          uv pip install --python "$GC_CI_ROOT/installed-venv/bin/python" --require-hashes --only-binary :all: -r "$GC_CI_ROOT/test-requirements.txt"
          mkdir "$GC_CI_ROOT/installed-tests"
          cp -R "$GITHUB_WORKSPACE/tests" "$GC_CI_ROOT/installed-tests/tests"
          cp "$GITHUB_WORKSPACE/tools/ci_pytest.py" "$GC_CI_ROOT/installed-tests/ci_pytest.py"
          cp "$GITHUB_WORKSPACE/pyproject.toml" "$GC_CI_ROOT/installed-tests/pyproject.toml"
      - name: Verify installed project files against the selected source and wheel
        run: |
          set -eu
          gc_ci_site="$("$GC_CI_ROOT/installed-venv/bin/python" -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.ci_release --sdist "$GC_CI_ROOT/release/codex_session_gc-$GC_CI_VERSION.tar.gz" --wheel "$GC_CI_ROOT/release/codex_session_gc-$GC_CI_VERSION-py3-none-any.whl" --bundle "$GC_CI_ROOT/release/codex-session-gc-$GC_CI_VERSION-linux-x86_64" --helper "$GC_CI_ROOT/helper" --installed-site-packages "$gc_ci_site" > "$GC_CI_ROOT/installed-structure.json"
      - name: Evaluate installed doctor, CLI, Textual and MCP
        env:
          GC_MCP_NATIVE_HELPER: ${{ env.GC_CI_ROOT }}/release/codex-session-gc-${{ env.GC_CI_VERSION }}-linux-x86_64/codex-session-gc-native
        run: |
          set -eu
          unset PYTHONPATH
          cd "$GC_CI_ROOT/installed-tests"
          "$GC_CI_ROOT/installed-venv/bin/python" -c 'import codex_session_gc, sys; from pathlib import Path; source = Path(codex_session_gc.__file__).resolve(); print(source); assert source.is_relative_to(Path(sys.prefix).resolve())'
          "$GC_CI_ROOT/installed-venv/bin/python" ci_pytest.py tests/test_doctor.py tests/test_closed_work_cli.py tests/test_closed_work_execution_cli.py tests/test_textual_console.py tests/test_mcp_server.py tests/test_mcp_native.py tests/test_mcp_disconnect.py tests/test_mixed_native.py --basetemp "$GC_CI_ROOT/installed-homes" -o "cache_dir=$GC_CI_ROOT/installed-cache" --junitxml "$GC_CI_ROOT/installed.xml"
      - name: Archive only verified release outputs
        run: |
          set -eu
          "$UV_PROJECT_ENVIRONMENT/bin/python" -m tools.build_release --archive "$GC_CI_ROOT/release/codex-session-gc-$GC_CI_VERSION-linux-x86_64" --output "$GC_CI_ROOT/release/codex-session-gc-$GC_CI_VERSION-linux-x86_64.tar.gz"
          cd "$GC_CI_ROOT/release"
          sha256sum "codex-session-gc-$GC_CI_VERSION-linux-x86_64.tar.gz" "codex_session_gc-$GC_CI_VERSION-py3-none-any.whl" "codex_session_gc-$GC_CI_VERSION.tar.gz" "codex-session-gc-installer-$GC_CI_VERSION.pyz" > SHA256SUMS
          echo 'Matched source, native and installed-artifact gates passed on this workflow source. The helper was selected from separately qualified native material; this workflow did not compile it. No release publication was performed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain verified artifacts and receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: matched-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GC_CI_ROOT }}/release/codex-session-gc-${{ env.GC_CI_VERSION }}-linux-x86_64.tar.gz
            ${{ env.GC_CI_ROOT }}/release/codex_session_gc-${{ env.GC_CI_VERSION }}-py3-none-any.whl
            ${{ env.GC_CI_ROOT }}/release/codex_session_gc-${{ env.GC_CI_VERSION }}.tar.gz
            ${{ env.GC_CI_ROOT }}/release/codex-session-gc-installer-${{ env.GC_CI_VERSION }}.pyz
            ${{ env.GC_CI_ROOT }}/release/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Retain bounded native and installed test receipts
        if: ${{ always() && env.GC_CI_ROOT != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifact-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.GC_CI_ROOT }}/runtime.json
            ${{ env.GC_CI_ROOT }}/anchors.json
            ${{ env.GC_CI_ROOT }}/native-source.json
            ${{ env.GC_CI_ROOT }}/native-reuse.json
            ${{ env.GC_CI_ROOT }}/structure.json
            ${{ env.GC_CI_ROOT }}/installed-structure.json
            ${{ env.GC_CI_ROOT }}/native.xml
            ${{ env.GC_CI_ROOT }}/installed.xml
          if-no-files-found: warn
          retention-days: 3
      - name: Remove only owned job resources
        if: always()
        run: |
          set -eu
          if [ -n "${GC_CI_ROOT:-}" ]; then
            case "$GC_CI_ROOT" in
              "$RUNNER_TEMP"/codex-session-gc-artifacts.*) rm -rf -- "$GC_CI_ROOT" ;;
              *) echo 'Unexpected cleanup path' >&2; exit 1 ;;
            esac
          fi

  attest-artifacts:
    name: Attest qualified assembly
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.matched-artifacts.result == 'success' }}
    needs: matched-artifacts
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        kind: [bundle, wheel, sdist, installer]
    steps:
      - name: Download this run's qualified assembly
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: matched-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-assembly
      - name: Verify the assembled output and select one subject
        id: subject
        env:
          GC_CI_SUBJECT_KIND: ${{ matrix.kind }}
        run: |
          set -eu
          cd "$RUNNER_TEMP/qualified-assembly"
          sha256sum --check SHA256SUMS
          case "$GC_CI_SUBJECT_KIND" in
            bundle) set -- codex-session-gc-*-linux-x86_64.tar.gz ;;
            wheel) set -- codex_session_gc-*-py3-none-any.whl ;;
            sdist) set -- codex_session_gc-*.tar.gz ;;
            installer) set -- codex-session-gc-installer-*.pyz ;;
            *) exit 1 ;;
          esac
          test "$#" -eq 1 && test -f "$1"
          printf 'path=%s/%s\n' "$PWD" "$1" >> "$GITHUB_OUTPUT"
      - name: Attest this exact qualified assembly output
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subject.outputs.path }}

  attest-support:
    name: Attest selected source support record
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.mode == 'support'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate and prepare exact source bytes
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          set -eu
          python3 -m tools.support_record --output "$RUNNER_TEMP/codex-session-gc-support.json"
      - name: Attest the exact support record
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/codex-session-gc-support.json
      - name: Retain the attested record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: support-record-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codex-session-gc-support.json
          if-no-files-found: error
          retention-days: 3
