[package]
name = "codex-session-gc-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
as_conversions = "deny"

[features]
fixtures = ["codex-thread-store/fixtures", "dep:codex-agent-message-board-extension"]

[[bin]]
name = "gc-native-fixture"
path = "src/fixture.rs"
required-features = ["fixtures"]

[dependencies]
codex-agent-message-board-extension = { path = "../upstream/codex-rs/ext/agent-message-board", optional = true }
codex-thread-store = { path = "../upstream/codex-rs/thread-store" }
codex-state = { path = "../upstream/codex-rs/state" }
codex-rollout = { path = "../upstream/codex-rs/rollout" }
codex-protocol = { path = "../upstream/codex-rs/protocol" }
chrono = { version = "0.4", features = ["serde"] }

codex-utils-absolute-path = { path = "../upstream/codex-rs/utils/absolute-path" }
serde_json = "1"
anyhow = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite-bundled"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
